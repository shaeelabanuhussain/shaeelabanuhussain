name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Draw the snake from my contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github&color_snake=#f5a524&color_dots=#ebedf0,#b2f0e8,#5eead4,#2dd4bf,#0f766e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f5a524&color_dots=#161b22,#0f3d3a,#14706a,#1fa89a,#2dd4bf

      - name: Publish the snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
